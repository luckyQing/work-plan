<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 任务排期管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-box { background: #fff; border-radius: 12px; padding: 40px; width: 400px; max-width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .login-box h2 { text-align: center; margin-bottom: 30px; color: #333; font-size: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #666; }
        .form-group input { width: 100%; padding: 10px 14px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; transition: border-color 0.3s; }
        .form-group input:focus { outline: none; border-color: #1890ff; box-shadow: 0 0 0 2px rgba(24,144,255,0.2); }
        .btn-login { width: 100%; padding: 12px; background: #1890ff; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
        .btn-login:hover { background: #40a9ff; }
        .msg { text-align: center; margin-top: 15px; color: #ff4d4f; font-size: 14px; min-height: 20px; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>任务排期管理系统</h2>
    <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" value="admin">
    </div>
    <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="请输入密码" value="123456">
    </div>
    <button class="btn-login" onclick="doLogin()">登 录</button>
    <div class="msg" id="msg"></div>
</div>
<script>
/* 如果已登录，直接跳转 */
if (localStorage.getItem('token')) { location.href = 'week-view.html'; }

function doLogin() {
    var u = document.getElementById('username').value;
    var p = document.getElementById('password').value;
    if (!u || !p) { document.getElementById('msg').textContent = '请输入用户名和密码'; return; }
    fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
    }).then(function(r) { return r.json(); }).then(function(res) {
        if (res.code === 200) {
            localStorage.setItem('token', res.data.token);
            localStorage.setItem('currentUser', JSON.stringify(res.data));
            location.href = 'week-view.html';
        } else {
            document.getElementById('msg').textContent = res.msg;
        }
    }).catch(function() {
        document.getElementById('msg').textContent = '网络错误，请重试';
    });
}
/* 回车登录 */
document.getElementById('password').addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
