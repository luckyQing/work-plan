server:
  port: 8080
  error:
    # 默认错误响应不暴露异常堆栈与内部消息给前端
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  aop:
    proxy-target-class: true  # 强制使用 CGLIB 代理，解决 Shiro 注解与 ServiceImpl 的代理冲突
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://10.60.8.31:3308/work_plan?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: YOUxin@com
  redis:
    host: localhost
    port: 6379
    timeout: 3000

# ShardingSphere 分表参数（修改日期范围时需同步 schema.sql 建表脚本）
sharding:
  # 是否打印 ShardingSphere 改写后的实际 SQL
  sql-show: true
  work-log:
    start-date: "2026-01-01 00:00:00"
    end-date: "2027-12-31 23:59:59"

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
